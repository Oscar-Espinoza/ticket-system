# Self-hosted ticket-system: Postgres + the local Neon proxy (the app speaks the
# Neon HTTP/WebSocket protocol) + migrations + the app + a daily cron.
# Usage: cp docker/selfhost.env.example .env && edit .env && docker compose up -d --build
# See docs/SELF_HOSTING.md.

x-db-env: &db-env
  # Host db.localtest.me is the proxy's endpoint name; traffic goes to NEON_PROXY_HOST.
  DATABASE_URL: postgres://${POSTGRES_USER:-tickets}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db.localtest.me:5432/${POSTGRES_DB:-tickets}
  NEON_PROXY_HOST: neon-proxy:4444

x-app-build: &app-build
  context: .
  target: runner
  args:
    NEXT_PUBLIC_APP_URL: ${APP_URL:?set APP_URL in .env}
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-neon-proxy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    restart: unless-stopped
    environment:
      PG_CONNECTION_STRING: postgres://${POSTGRES_USER:-tickets}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tickets}
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: build
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
    command: ["node", "scripts/migrate.mjs"]
    environment: *db-env
    depends_on:
      - neon-proxy
    restart: "no"

  app:
    build: *app-build
    image: ticket-system-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      <<: *db-env
      BETTER_AUTH_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_BASE_URL: ${GITHUB_WEBHOOK_BASE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      ALLOW_PRIVATE_OUTGOING_URLS: ${ALLOW_PRIVATE_OUTGOING_URLS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  cron:
    build: *app-build
    image: ticket-system-app
    restart: unless-stopped
    command: ["node", "scripts/cron-loop.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET}
      CRON_TARGET_URL: http://app:3000
    depends_on:
      - app

volumes:
  pgdata:
